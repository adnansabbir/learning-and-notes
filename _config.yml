title: Learning & Notes
description: Personal technical learning journal — practical-first notes.
remote_theme: just-the-docs/just-the-docs
permalink: pretty

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
nav_sort: case_insensitive
color_scheme: dark

mermaid:
  version: "11.4.1"

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

exclude:
  - CLAUDE.md
  - claude-handoff.md
  - .idea/
  - .claude/
  - README.md
  - tryhackme/README.md
  - machine-learning/README.md
  - machine-learning/notebooks/

<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/icon.svg' | relative_url }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="theme-color" content="#1c1c1e">

<style>
  .reading-time {
    font-size: 0.85rem;
    color: #a3abb4;
    margin: -0.75rem 0 1.5rem;
    font-weight: normal;
    display: block;
  }
  .force-refresh-btn {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(60, 60, 60, 0.85);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    -webkit-tap-highlight-color: transparent;
    line-height: 1;
    padding: 0;
  }
  .force-refresh-btn:hover {
    background: rgba(80, 80, 80, 0.95);
  }
  .force-refresh-btn:disabled {
    opacity: 0.6;
    cursor: wait;
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    .force-refresh-btn {
      bottom: calc(1rem + env(safe-area-inset-bottom));
    }
  }
  .search-scope-toggle {
    display: inline-block;
    margin: 0.4rem 0 0 0.1rem;
    padding: 0.15rem 0.6rem;
    font-size: 0.75rem;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(60, 60, 60, 0.6);
    color: #ccc;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .search-scope-toggle.is-all {
    background: rgba(9, 105, 218, 0.3);
    color: #fff;
    border-color: rgba(9, 105, 218, 0.6);
  }
</style>

<script>
  /* ---- Service worker registration ---- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}', {
        scope: '{{ "/" | relative_url }}',
        updateViaCache: 'none'
      }).catch(function (err) { console.warn('SW register failed', err); });
    });
  }

  /* ---- DOM injection: reading time + force-refresh button ---- */
  function thmInjectChrome() {
    try {
      /* Reading time */
      var main = document.querySelector('main, .main-content, article');
      var h1 = (main || document).querySelector('h1');
      if (h1 && !h1.parentNode.querySelector('.reading-time')) {
        var bodyEl = main || document.body;
        var pres = bodyEl.querySelectorAll('pre');
        var codeWords = 0;
        for (var i = 0; i < pres.length; i++) {
          codeWords += (pres[i].innerText || '').split(/\s+/).filter(Boolean).length;
        }
        var totalText = (bodyEl.innerText || '').split(/\s+/).filter(Boolean).length;
        var proseWords = Math.max(0, totalText - codeWords);
        if (proseWords + codeWords >= 40) {
          var minutes = Math.max(1, Math.ceil(proseWords / 200 + codeWords / 100));
          var meta = document.createElement('div');
          meta.className = 'reading-time';
          meta.textContent = '⏱️ ' + minutes + ' min read';
          h1.insertAdjacentElement('afterend', meta);
        }
      }
    } catch (e) { console.warn('reading-time inject failed', e); }

    try {
      /* Force-refresh button (always inject — never hidden) */
      if (!document.querySelector('.force-refresh-btn')) {
        var btn = document.createElement('button');
        btn.className = 'force-refresh-btn';
        btn.setAttribute('aria-label', 'Force refresh');
        btn.title = 'Force refresh — clears cache and reloads';
        btn.textContent = '↻';
        btn.addEventListener('click', async function () {
          btn.disabled = true;
          btn.textContent = '…';
          try {
            if ('serviceWorker' in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
            if (window.caches) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
          } catch (e) { console.warn('refresh cleanup failed', e); }
          location.reload();
        });
        document.body.appendChild(btn);
      }
    } catch (e) { console.warn('refresh button inject failed', e); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', thmInjectChrome);
  } else {
    thmInjectChrome();
  }

  /* ---- Scoped search: default results to the current top-level subject ----
     this script tag runs in <head>, before <body> exists — so lunr
     patching (no DOM needed) starts immediately, but anything touching
     #search-input must wait for DOMContentLoaded. ---- */
  (function () {
    var SITE_BASE = '{{ site.baseurl }}';
    var SEARCH_DATA_URL = '{{ "/assets/js/search-data.json" | relative_url }}';
    var scopeAll = false;
    var docsByRef = null;

    function currentSubjectPrefix() {
      var path = location.pathname;
      if (SITE_BASE && path.indexOf(SITE_BASE) === 0) path = path.slice(SITE_BASE.length);
      var seg = path.split('/').filter(Boolean)[0];
      return seg ? ('/' + seg + '/') : null;
    }

    function patchLunrQuery() {
      if (!window.lunr || !window.lunr.Index || lunr.Index.prototype.__thmScoped) return;
      var origQuery = lunr.Index.prototype.query;
      lunr.Index.prototype.query = function () {
        var results = origQuery.apply(this, arguments);
        if (scopeAll || !docsByRef) return results;
        var prefix = currentSubjectPrefix();
        if (!prefix) return results;
        return results.filter(function (r) {
          var doc = docsByRef[r.ref];
          return doc && doc.relUrl && doc.relUrl.indexOf(prefix) === 0;
        });
      };
      lunr.Index.prototype.__thmScoped = true;
    }

    fetch(SEARCH_DATA_URL)
      .then(function (r) { return r.json(); })
      .then(function (data) { docsByRef = data; patchLunrQuery(); })
      .catch(function (e) { console.warn('scoped search data fetch failed', e); });

    var tries = 0;
    var waitForLunr = setInterval(function () {
      patchLunrQuery();
      if ((window.lunr && lunr.Index && lunr.Index.prototype.__thmScoped) || ++tries > 30) {
        clearInterval(waitForLunr);
      }
    }, 100);

    function addScopeToggle() {
      var searchInput = document.getElementById('search-input');
      if (!searchInput || document.getElementById('search-scope-toggle')) return;
      var prefix = currentSubjectPrefix();
      if (!prefix) return; /* nothing to scope on the site home page */
      var wrap = document.querySelector('.search-input-wrap');
      if (!wrap) return;

      var toggle = document.createElement('button');
      toggle.id = 'search-scope-toggle';
      toggle.type = 'button';
      toggle.className = 'search-scope-toggle';
      toggle.textContent = 'This section only';
      toggle.addEventListener('click', function () {
        scopeAll = !scopeAll;
        toggle.textContent = scopeAll ? 'All subjects' : 'This section only';
        toggle.classList.toggle('is-all', scopeAll);
        var val = searchInput.value;
        searchInput.value = '';
        searchInput.dispatchEvent(new Event('keyup'));
        searchInput.value = val;
        searchInput.dispatchEvent(new Event('keyup'));
      });
      wrap.insertAdjacentElement('afterend', toggle);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', addScopeToggle);
    } else {
      addScopeToggle();
    }
  })();
</script>

<script>
  /* ---- Math: load MathJax only on pages that contain math ----
     kramdown turns $$...$$ into \(...\) (inline) or \[...\] (block). ---- */
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
  };
  document.addEventListener('DOMContentLoaded', function () {
    var main = document.querySelector('main, .main-content') || document.body;
    var text = main.textContent;
    if (text.indexOf('\\(') === -1 && text.indexOf('\\[') === -1) return;
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js';
    s.async = true;
    document.head.appendChild(s);
  });
</script>

<style>
  /* ---- Math: long block formulas scroll on their own instead of widening the page.
     The padding keeps tall parts (∑ limits, superscripts) from being clipped. ---- */
  mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 0.3em 0; }
</style>

<style>
  /* ---- Tables on phones: the theme gives every cell a wide minimum width, so tables with
     4-5 columns scroll sideways. Let cells shrink to their content on small screens. ---- */
  @media (max-width: 600px) {
    .main-content th, .main-content td { min-width: 0; padding: 0.4rem 0.55rem; }
  }
</style>

<style>
  /* ---- Footer credit (_includes/footer_custom.html) ---- */
  .made-by { margin: 0.5rem 0 0; font-size: 0.85rem; color: #9da5ae; }
  .made-by a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
</style>

<style>
  /* ---- Runnable Python blocks (assets/js/pyrun.js) ---- */
  .runnable { margin-bottom: 0 !important; }
  .pyrun-bar { display: flex; align-items: center; gap: 0.75rem; margin: 0.4rem 0 1rem; }
  .pyrun-btn {
    padding: 0.3rem 0.9rem; border-radius: 6px; border: 1px solid rgba(9, 105, 218, 0.7);
    background: rgba(9, 105, 218, 0.25); color: #fff; font: inherit; font-size: 0.85rem; cursor: pointer;
  }
  .pyrun-btn:disabled { opacity: 0.6; cursor: wait; }
  .pyrun-status { font-size: 0.8rem; color: #999; }
  .pyrun-output {
    margin: -0.4rem 0 1.25rem; padding: 0.75rem; border-left: 3px solid rgba(9, 105, 218, 0.7);
    background: rgba(255, 255, 255, 0.03);
  }
  .pyrun-text { margin: 0 0 0.5rem; white-space: pre-wrap; font-size: 0.8rem; background: none; }
  .pyrun-error { color: #ff7b72; }
  .pyrun-figure { display: block; max-width: 100%; height: auto; margin: 0.5rem 0; background: #fff; border-radius: 4px; }
</style>
<script defer src="{{ '/assets/js/pyrun.js' | relative_url }}"></script>

<style>
  /* ---- Interactive function plots (assets/js/fnplot.js) ---- */
  .fn-plot { margin: 1rem 0 1.5rem; padding: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px; background: rgba(255, 255, 255, 0.02); }
  .fn-plot-formula { font-family: Georgia, 'Times New Roman', serif; font-size: 1.15rem; text-align: center; margin-bottom: 0.5rem; color: #e6edf3; }
  .fn-plot-formula { display: flex; flex-wrap: wrap; justify-content: center; column-gap: 1.5rem; row-gap: 0.2rem; }
  .fn-plot-readout { font-size: 1rem; color: #f2cc60; }
  .fn-plot-formula-part { white-space: nowrap; }
  .fn-plot-svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .fn-plot-grid line { stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; }
  .fn-plot-axis line { stroke: rgba(255, 255, 255, 0.45); stroke-width: 1.5; }
  .fn-plot-frame { fill: none; stroke: rgba(255, 255, 255, 0.2); }
  .fn-plot-tick { fill: #9da5ae; font-size: 13px; }
  .fn-plot-label { fill: #e6edf3; font-size: 16px; font-style: italic; font-family: Georgia, serif; }
  .fn-plot-line { fill: none; stroke: #58a6ff; stroke-width: 3; stroke-linecap: round; }
  .fn-plot-points path { stroke: #ff6b6b; stroke-width: 3; stroke-linecap: round; }
  .fn-plot-guide { stroke: #f2cc60; stroke-width: 2.5; stroke-dasharray: 3 6; stroke-linecap: round; }
  .fn-plot-marker { fill: #ff8080; stroke: #ffd6d6; stroke-width: 1.5; filter: drop-shadow(0 0 4px #ff5c5c) drop-shadow(0 0 10px rgba(255, 92, 92, 0.7)); }
  .fn-plot-marker-label { fill: #ff9b9b; font-size: 15px; font-weight: 600; }
  .fn-plot-error-label { fill: #f2cc60; font-size: 13px; font-weight: 600; paint-order: stroke; stroke: #27262b; stroke-width: 4px; stroke-linejoin: round; }
  .fn-plot-controls { display: grid; gap: 0.6rem; margin-top: 0.75rem; }
  .fn-plot-slider { display: flex; align-items: center; gap: 0.75rem; }
  .fn-plot-name { min-width: 5.5rem; font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; color: #e6edf3; }
  .fn-plot-slider input[type=range] { flex: 1; min-width: 0; height: 2rem; accent-color: #58a6ff; }
  .fn-plot-3d { width: 100%; height: 440px; display: flex; align-items: center; justify-content: center; color: #9da5ae; }
  @media (max-width: 600px) { .fn-plot-3d { height: 380px; } }
  .fn-plot-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.9rem; margin-top: 0.4rem; }
  .fn-plot-reset { padding: 0.3rem 0.8rem; border-radius: 6px; border: 1px solid rgba(9, 105, 218, 0.7); background: rgba(9, 105, 218, 0.25); color: #fff; font: inherit; font-size: 0.85rem; cursor: pointer; }
  .fn-plot-hint { font-size: 0.8rem; color: #a3abb4; }
  .fn-plot-contour { width: 100%; height: 520px; display: flex; align-items: center; justify-content: center; color: #9da5ae; }
  @media (max-width: 600px) { .fn-plot-contour { height: 440px; } }
  .fn-plot-steps { max-height: 13rem; overflow-y: auto; margin-top: 0.6rem; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 6px; }
  .fn-plot-steps table { margin: 0; width: 100%; min-width: 0; display: table; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .fn-plot-steps th, .fn-plot-steps td { padding: 0.3rem 0.5rem; min-width: 0; }
  .fn-plot-steps th { position: sticky; top: 0; }
  .fn-plot-pair { display: grid; grid-template-columns: 1fr; gap: 0.75rem; align-items: center; }
  @media (min-width: 860px) { .fn-plot-pair { grid-template-columns: 1.15fr 1fr; } .fn-plot-pair .fn-plot-3d { height: 400px; } }
  .fn-plot-linked .fn-plot-formula { font-size: 1rem; margin-bottom: 0.25rem; }
  .fn-plot-linked .fn-plot-readout { font-size: 0.9rem; }
</style>
<script defer src="{{ '/assets/js/fnplot.js' | relative_url }}"></script>
